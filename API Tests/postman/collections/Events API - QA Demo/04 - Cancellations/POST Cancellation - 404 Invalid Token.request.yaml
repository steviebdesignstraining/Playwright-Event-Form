$kind: http-request
description: "Negative test: cancellation token is invalid."
url: "{{baseUrl}}/api/cancellations/{{invalidToken}}"
method: POST
scripts:
  - type: afterResponse
    code: |-
      pm.test('Status code is 404', function () {
          pm.response.to.have.status(404);
      });
    language: text/javascript
order: 2000
