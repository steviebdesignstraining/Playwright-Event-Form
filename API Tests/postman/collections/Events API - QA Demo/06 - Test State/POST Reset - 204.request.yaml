$kind: http-request
description: "Test-only endpoint: restore the seeded test state."
url: "{{baseUrl}}/api/reset"
method: POST
scripts:
  - type: afterResponse
    code: |-
      pm.test('Status code is 204', function () {
          pm.response.to.have.status(204);
      });
    language: text/javascript
order: 1000
