$kind: http-request
description: "Negative test: invalid registration payload."
url: "{{baseUrl}}/api/events/{{eventId}}/registrations"
method: POST
headers:
  Content-Type: application/json
body:
  type: text
  content: |-
    {
      "name": "",
      "email": "empty-name-{{$randomUUID}}@example.com"
    }
scripts:
  - type: afterResponse
    code: |-
      pm.test('Status code is 400', function () {
          pm.response.to.have.status(400);
      });
    language: text/javascript
order: 2000
