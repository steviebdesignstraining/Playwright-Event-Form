name: AI QA Bug Reporting Pipeline

on:
  push:
    branches: ["main", "master"]
  pull_request:
    branches: ["main", "master"]
  workflow_dispatch:

permissions:
  contents: read
  issues: write
  pull-requests: read
  pages: write
  id-token: write
  repository-projects: write

concurrency:
  group: "pages"
  cancel-in-progress: false

env:
  GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
  GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

jobs:

  # ============================================================
  # 1. RUN PLAYWRIGHT
  # ============================================================

  run-tests:
    name: Run Playwright Tests
    runs-on: ubuntu-latest
    timeout-minutes: 120

    outputs:
      has_failure: ${{ steps.check-failure.outputs.has_failure }}

    steps:

      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: lts/*
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright browsers
        run: npx playwright install --with-deps

      - name: Clean previous test results
        run: |
          rm -rf allure-results
          rm -rf allure-report
          rm -rf playwright-report
          rm -rf test-results
          rm -f failure-data.json
          rm -f bug-analysis.json
          rm -f validated-bug.json
          rm -f created-issues.json

      - name: Run Playwright tests
        id: test-run
        env:
          DOTENVX_KEY: ${{ secrets.DOTENVX_KEY }}
        run: npm run test -- --workers=4 --retries=1
        continue-on-error: true

      # --------------------------------------------------------
      # IMPORTANT:
      # Inspect Playwright's JSON reporter structure.
      # Do NOT use result.tests.
      # --------------------------------------------------------

      - name: Check if tests failed
        id: check-failure
        if: always()
        shell: bash
        run: |
          echo "Checking Playwright results..."

          RESULTS_FILE="test-results/results.json"

          if [ ! -f "$RESULTS_FILE" ]; then
            echo "No Playwright results.json found at $RESULTS_FILE"
            echo "has_failure=false" >> "$GITHUB_OUTPUT"
            echo "failure_count=0" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          node <<'NODE'
          const fs = require('fs');

          const file = 'test-results/results.json';
          const result = JSON.parse(fs.readFileSync(file, 'utf8'));

          const failures = new Map();

          function walkSuites(suites = []) {
            for (const suite of suites) {

              for (const spec of suite.specs || []) {

                for (const test of spec.tests || []) {

                  const failedResults = (test.results || [])
                    .filter(result => result.status === 'failed');

                  if (failedResults.length === 0) {
                    continue;
                  }

                  const project = test.projectName || 'unknown';

                  const key = `${project}::${spec.title}`;

                  if (!failures.has(key)) {
                    failures.set(key, {
                      test: spec.title,
                      project,
                      attempts: failedResults.length,
                      retries: failedResults.map(r => r.retry ?? 0)
                    });
                  }
                }
              }

              walkSuites(suite.suites || []);
            }
          }

          walkSuites(result.suites || []);

          const uniqueFailures = [...failures.values()];

          console.log('');
          console.log('========================================');
          console.log('Playwright Failure Summary');
          console.log('========================================');
          console.log(`Unique failed tests: ${uniqueFailures.length}`);

          for (const failure of uniqueFailures) {
            console.log(
              `FAILED: [${failure.project}] ${failure.test} | attempts=${failure.attempts}`
            );
          }

          console.log('========================================');

          const hasFailure =
            uniqueFailures.length > 0 ? 'true' : 'false';

          fs.appendFileSync(
            process.env.GITHUB_OUTPUT,
            `has_failure=${hasFailure}\n`
          );

          fs.appendFileSync(
            process.env.GITHUB_OUTPUT,
            `failure_count=${uniqueFailures.length}\n`
          );

          console.log(`has_failure=${hasFailure}`);
          NODE
      # --------------------------------------------------------
      # Generate failure data whenever a failure was detected.
      # --------------------------------------------------------

      - name: Generate failure data
        if: steps.check-failure.outputs.has_failure == 'true'
        run: |
          echo "========================================"
          echo "Generating failure-data.json"
          echo "========================================"

          npm run generate:failure-data

          if [ ! -f "failure-data.json" ]; then
            echo "ERROR: generate-failure-data did not create failure-data.json"
            exit 1
          fi

          echo "failure-data.json successfully generated."

          node -e "
            const data = require('./failure-data.json');
            console.log('Failure records:', data.length);
          "

      - name: Verify failure data
        if: always()
        run: |
          echo "Checking generated failure data..."

          if [ -f "failure-data.json" ]; then
            echo "failure-data.json exists."

            echo "Number of failures:"
            node -e "
              const data = require('./failure-data.json');
              console.log(data.length);
            "

            echo "Failure data:"
            cat failure-data.json
          else
            echo "No failure-data.json generated."
          fi

      # --------------------------------------------------------
      # Upload everything needed by downstream jobs.
      # --------------------------------------------------------

      - name: Upload Playwright evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-evidence
          path: |
            test-results/
            playwright-report/
            allure-results/
            failure-data.json
          if-no-files-found: warn
          retention-days: 30


  # ============================================================
  # 2. AI FAILURE ANALYSIS
  # ============================================================

  analyse-failure:
    name: AI Feature Analysis
    needs: run-tests

    # Run this only when Playwright actually detected a failure.
    if: needs.run-tests.outputs.has_failure == 'true'

    runs-on: ubuntu-latest
    timeout-minutes: 60

    outputs:
      analysis_complete: ${{ steps.analysis-status.outputs.complete }}

    steps:

      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: lts/*
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Download Playwright evidence
        uses: actions/download-artifact@v4
        with:
          name: playwright-evidence
          path: .

      - name: Verify failure data
        id: verify-failure-data
        run: |
          if [ ! -f "failure-data.json" ]; then
            echo "ERROR: failure-data.json was not downloaded."
            exit 1
          fi

          FAILURE_COUNT=$(node -e "
            const data = require('./failure-data.json');
            console.log(data.length);
          ")

          echo "Failure records: $FAILURE_COUNT"

          if [ "$FAILURE_COUNT" -eq 0 ]; then
            echo "No failures available for AI analysis."
            exit 1
          fi

      - name: Run Gemini AI analysis
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GEMINI_MODEL: ${{ vars.GEMINI_MODEL || 'gemini-2.5-flash' }}
        run: |
          echo "========================================"
          echo "Running AI Feature Analysis"
          echo "========================================"

          npx tsx scripts/analyse-failure.ts

      - name: Validate bug analysis
        run: npx tsx scripts/validate-with-copilot.ts

      - name: Verify analysis output
        id: analysis-status
        run: npx tsx scripts/verify-analysis-health.ts

      - name: Upload AI analysis
        uses: actions/upload-artifact@v4
        with:
          name: ai-analysis
          path: |
            bug-analysis.json
            validated-bug.json
          if-no-files-found: error
          retention-days: 30


  # ============================================================
  # 3. CREATE GITHUB ISSUE
  # ============================================================

  create-issue:
    name: Create GitHub Issue
    needs:
      - run-tests
      - analyse-failure

    # always() is required because analyse-failure is conditionally
    # executed. We then explicitly check its result.
    if: |
      always() &&
      needs.run-tests.result == 'success' &&
      needs.run-tests.outputs.has_failure == 'true' &&
      needs.analyse-failure.result == 'success'

    runs-on: ubuntu-latest
    timeout-minutes: 60

    outputs:
      issues_created: ${{ steps.check-bugs.outputs.issues_created }}

    steps:

      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: lts/*
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Download AI analysis
        uses: actions/download-artifact@v4
        with:
          name: ai-analysis
          path: .

      - name: Inspect validated bug schema
        if: always()
        run: npx tsx scripts/inspect-validated-bugs.ts

      - name: Check validated bugs
        id: check-bugs
        run: npx tsx scripts/check-validated-bugs.ts

      - name: Create GitHub Issues
        if: steps.check-bugs.outputs.issues_created == 'true'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          echo "========================================"
          echo "Creating GitHub Issues"
          echo "========================================"

          npx tsx scripts/create-github-issue.ts

      - name: Verify created issues
        if: steps.check-bugs.outputs.issues_created == 'true'
        run: |
          if [ ! -f "created-issues.json" ]; then
            echo "ERROR: create-github-issue.ts did not create created-issues.json"
            exit 1
          fi

          echo "Created issues:"
          cat created-issues.json

      - name: Upload created issues
        if: steps.check-bugs.outputs.issues_created == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: created-issues
          path: created-issues.json
          if-no-files-found: error
          retention-days: 30


  # ============================================================
  # 4. ADD ISSUES TO GITHUB PROJECT
  # ============================================================

  add-to-project:
    name: Add to GitHub Project
    needs:
      - run-tests
      - create-issue

    if: |
      always() &&
      needs.run-tests.result == 'success' &&
      needs.create-issue.result == 'success' &&
      needs.create-issue.outputs.issues_created == 'true'

    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:

      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: lts/*
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Download created issues
        uses: actions/download-artifact@v4
        with:
          name: created-issues
          path: .

      - name: Verify created issues
        run: |
          if [ ! -f "created-issues.json" ]; then
            echo "ERROR: created-issues.json not found."
            exit 1
          fi

          echo "Issues to add:"
          cat created-issues.json

      - name: Add issues to GitHub Project
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PROJECT_NAME: ${{ vars.PROJECT_NAME }}
        run: |
          echo "========================================"
          echo "Adding issues to GitHub Project"
          echo "Project: $PROJECT_NAME"
          echo "========================================"

          npx tsx scripts/add-to-project.ts


  # ============================================================
  # 5. ALLURE
  # ============================================================

  generate-allure-report:
    name: Generate Allure Report
    needs: run-tests
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:

      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: lts/*
          cache: npm

      - name: Download Allure results
        uses: actions/download-artifact@v4
        with:
          name: playwright-evidence
          path: .

      - name: Install dependencies
        run: npm ci

      - name: Generate Allure HTML report
        run: |
          rm -rf allure-report

          if [ ! -d "allure-results" ]; then
            echo "No Allure results found."
            exit 1
          fi

          npx allure generate allure-results \
            --clean \
            -o allure-report

          touch allure-report/.nojekyll

      - name: Upload Allure report
        uses: actions/upload-artifact@v4
        with:
          name: allure-report
          path: allure-report/
          if-no-files-found: error
          retention-days: 30


  # ============================================================
  # 6. DEPLOY ALLURE
  # ============================================================

  deploy-allure:
    name: Deploy Allure to GitHub Pages
    needs: generate-allure-report
    if: always() && needs.generate-allure-report.result == 'success'

    runs-on: ubuntu-latest
    timeout-minutes: 30

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:

      - name: Download Allure report
        uses: actions/download-artifact@v4
        with:
          name: allure-report
          path: allure-report

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: allure-report

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5