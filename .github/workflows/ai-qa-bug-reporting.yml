name: AI QA Bug Reporting Pipeline

on:
  push:
    branches: ["main", "master"]
  pull_request:
    branches: ["main", "master"]
  workflow_dispatch:

permissions:
  contents: read
  issues: write
  pull-requests: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

env:
  OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}

jobs:

  run-tests:
    name: Run Playwright Tests
    runs-on: ubuntu-latest
    timeout-minutes: 120

    outputs:
      has_failure: ${{ steps.check-failure.outputs.has_failure }}

    steps:

      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: lts/*
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright browsers
        run: npx playwright install --with-deps

      - name: Clean previous test results
        run: |
          rm -rf allure-results
          rm -rf allure-report
          rm -rf playwright-report
          rm -rf test-results
          rm -f failure-data.json
          rm -f bug-analysis.json
          rm -f validated-bug.json
          rm -f created-issues.json

      - name: Run Playwright tests
        env:
          DOTENVX_KEY: ${{ secrets.DOTENVX_KEY }}
        run: npm run test -- --workers=4 --retries=1
        continue-on-error: true
        id: test-run

      - name: Check if tests failed
        id: check-failure
        if: always()
        run: |
          if [ ! -f "playwright-report/results.json" ]; then
            echo "has_failure=false" >> "$GITHUB_OUTPUT"
            echo "No Playwright results.json found."
            exit 0
          fi

          FAILED=$(node - <<'NODE'
          const fs = require('fs');

          const result = JSON.parse(
            fs.readFileSync('playwright-report/results.json', 'utf8')
          );

          function hasFailedTests(suites = []) {
            for (const suite of suites) {
              for (const spec of suite.specs || []) {
                for (const test of spec.tests || []) {
                  if ((test.results || []).some(r => r.status === 'failed')) {
                    return true;
                  }
                }
              }

              if (hasFailedTests(suite.suites || [])) {
                return true;
              }
            }

            return false;
          }

          console.log(
            hasFailedTests(result.suites || [])
              ? 'true'
              : 'false'
          );
          NODE
          )

          echo "has_failure=$FAILED" >> "$GITHUB_OUTPUT"
          echo "Playwright failures detected: $FAILED"

      - name: Generate failure data
        if: steps.check-failure.outputs.has_failure == 'true'
        run: npm run generate:failure-data

      - name: Verify generated failure data
        if: always()
        run: |
          if [ -f "failure-data.json" ]; then
            echo "failure-data.json generated successfully."
            cat failure-data.json
          else
            echo "No failure-data.json generated."
          fi

      - name: Upload Playwright evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-evidence
          path: |
            test-results/
            playwright-report/
            allure-results/
            failure-data.json
          if-no-files-found: warn
          retention-days: 30

  analyse-failure:
    name: AI Failure Analysis
    needs: run-tests
    if: needs.run-tests.outputs.has_failure == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:

      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: lts/*
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Download evidence
        uses: actions/download-artifact@v4
        with:
          name: playwright-evidence
          path: .

      - name: Verify failure data
        id: verify-failure-data
        run: |
          if [ ! -f "failure-data.json" ]; then
            echo "skip=true" >> "$GITHUB_OUTPUT"
            echo "No failure-data.json found."
            exit 0
          fi

          echo "skip=false" >> "$GITHUB_OUTPUT"
          echo "failure-data.json found."

      - name: Run OpenAI analysis
        if: steps.verify-failure-data.outputs.skip != 'true'
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        run: npx tsx scripts/analyse-failure.ts

      - name: Validate with Copilot
        if: steps.verify-failure-data.outputs.skip != 'true'
        run: npx tsx scripts/validate-with-copilot.ts

      - name: Upload analysis results
        if: steps.verify-failure-data.outputs.skip != 'true'
        uses: actions/upload-artifact@v4
        with:
          name: ai-analysis
          path: |
            bug-analysis.json
            validated-bug.json
          if-no-files-found: warn
          retention-days: 30

  create-issue:
    name: Create GitHub Issue
    needs: [run-tests, analyse-failure]
    if: |
      needs.run-tests.result == 'success' &&
      needs.analyse-failure.result == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:

      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: lts/*
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Download analysis
        if: always()
        continue-on-error: true
        uses: actions/download-artifact@v4
        with:
          name: ai-analysis
          path: .

      - name: Check for validated bugs
        if: always()
        id: check-bugs
        run: |
          if [ ! -f "validated-bug.json" ]; then
            echo "no_bugs=true" >> $GITHUB_OUTPUT
            echo "Skipping issue creation — no validated bugs found."
            exit 0
          fi
          PRODUCT_BUG_COUNT=$(node -e "const d=require('./validated-bug.json'); console.log(d.filter(x=>x.analysis&&x.analysis.classification==='PRODUCT_BUG').length)")
          echo "product_bug_count=$PRODUCT_BUG_COUNT" >> $GITHUB_OUTPUT
          echo "no_bugs=false" >> $GITHUB_OUTPUT

      - name: Create GitHub Issues
        if: steps.check-bugs.outputs.no_bugs == 'false' && steps.check-bugs.outputs.product_bug_count != '0'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: npx tsx scripts/create-github-issue.ts

      - name: Upload created issues
        if: steps.check-bugs.outputs.no_bugs == 'false'
        uses: actions/upload-artifact@v4
        with:
          name: created-issues
          path: created-issues.json
          if-no-files-found: warn
          retention-days: 30

  add-to-project:
    name: Add to GitHub Project
    needs: [run-tests, create-issue]
    if: always() && needs.create-issue.result == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:

      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: lts/*
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Download created issues
        if: always()
        continue-on-error: true
        uses: actions/download-artifact@v4
        with:
          name: created-issues
          path: .

      - name: Check for issues to add
        if: always()
        id: check-issues
        run: |
          if [ ! -f "created-issues.json" ]; then
            echo "no_issues=true" >> $GITHUB_OUTPUT
            echo "No issues to add to project."
            exit 0
          fi
          echo "no_issues=false" >> $GITHUB_OUTPUT

      - name: Add to project
        if: steps.check-issues.outputs.no_issues == 'false'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PROJECT_NAME: ${{ vars.PROJECT_NAME || 'AI QA Bug Reporting' }}
        run: npx tsx scripts/add-to-project.ts

  generate-allure-report:
    name: Generate Allure Report
    needs: run-tests
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:

      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: lts/*
          cache: npm

      - name: Download Allure results
        uses: actions/download-artifact@v4
        with:
          name: playwright-evidence
          path: .

      - name: Install dependencies
        run: npm ci

      - name: Generate Allure HTML report
        run: |
          rm -rf allure-report
          npx allure generate allure-results \
            --clean \
            -o allure-report
          touch allure-report/.nojekyll

      - name: Upload Allure report
        uses: actions/upload-artifact@v4
        with:
          name: allure-report
          path: allure-report/
          if-no-files-found: error
          retention-days: 30

  deploy-allure:
    name: Deploy Allure to GitHub Pages
    needs: generate-allure-report
    if: always() && needs.generate-allure-report.result == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 30

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:

      - name: Download Allure report
        uses: actions/download-artifact@v4
        with:
          name: allure-report
          path: allure-report

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: allure-report

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
