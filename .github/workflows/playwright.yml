name: Playwright Tests & Allure Report

on:
  push:
    branches: ["main", "master"]
  pull_request:
    branches: ["main", "master"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:

  # ============================================================
  # Stage 1: Run Playwright Tests
  # ============================================================
  run-tests:
    name: Run Playwright Tests
    runs-on: ubuntu-latest
    timeout-minutes: 120

    steps:

      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: lts/*
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright browsers
        run: npx playwright install --with-deps

      - name: Clean previous test results
        run: |
          rm -rf allure-results
          rm -rf allure-report
          rm -rf playwright-report
          rm -rf test-results
      - name: Run Playwright tests
        env:
          DOTENVX_KEY: ${{ secrets.DOTENVX_KEY }}
        run: npm run test -- --workers=4 --retries=1
        continue-on-error: true

      # ========================================================
      # Verify that Allure results were actually generated
      # ========================================================
      - name: Verify Allure results
        if: always()
        run: |
          echo "========================================"
          echo "ALLURE RESULTS DEBUG"
          echo "========================================"
          echo ""
          echo "Current directory:"
          pwd
          echo ""
          echo "Allure directories:"
          find . -type d -name "allure-results" -print || true
          echo ""
          echo "Allure files:"
          find . -type f -path "*/allure-results/*" -print || true
          echo ""
          echo "Allure result JSON files:"
          find . -type f -name "*-result.json" -print || true
          echo ""
          echo "Number of result files:"
          find . -type f -name "*-result.json" | wc -l
          echo ""
          echo "Root directory:"
          ls -la
          echo ""
          echo "========================================"
      # ========================================================
      # Upload Allure results
      # ========================================================
      - name: Upload Allure results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: allure-results
          path: allure-results/
          if-no-files-found: error
          retention-days: 30

      # ========================================================
      # Upload Playwright HTML report
      # ========================================================
      - name: Upload Playwright HTML report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          if-no-files-found: warn
          retention-days: 30

      # ========================================================
      # Upload Playwright test results / traces
      # ========================================================
      - name: Upload Playwright test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-test-results
          path: test-results/
          if-no-files-found: warn
          retention-days: 30


  # ============================================================
  # Stage 2: Generate Allure HTML Report
  # ============================================================
  generate-allure-report:
    name: Generate Allure Report
    needs: run-tests
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:

      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: lts/*
          cache: npm

      - name: Download Allure results
        uses: actions/download-artifact@v4
        with:
          name: allure-results
          path: allure-results

      # ========================================================
      # Verify downloaded results
      # ========================================================
      - name: Verify downloaded Allure results
        run: |
          echo "========================================"
          echo "DOWNLOADED ALLURE RESULTS"
          echo "========================================"
          echo ""
          echo "Allure results directory:"
          ls -la allure-results
          echo ""
          echo "Allure result files:"
          find allure-results -type f -name "*-result.json" -print
          echo ""
          echo "Number of result files:"
          find allure-results -type f -name "*-result.json" | wc -l
          echo ""
          echo "========================================"
          # Fail if no result files exist
          if ! find allure-results -type f -name "*-result.json" | grep -q .; then
            echo "ERROR: No Allure result JSON files were found."
            echo "The Playwright Allure reporter did not generate results."
            exit 1
          fi
      - name: Install dependencies
        run: npm ci

      # ========================================================
      # Generate Allure HTML
      # ========================================================
      - name: Generate Allure HTML report
        run: |
          echo "Generating Allure report..."
          rm -rf allure-report
          npx allure generate allure-results \
            --clean \
            -o allure-report
          echo ""
          echo "========================================"
          echo "ALLURE REPORT GENERATED"
          echo "========================================"
          ls -la allure-report
          echo ""
          echo "Checking index.html..."
          if [ ! -f "allure-report/index.html" ]; then
            echo "ERROR: Allure index.html was not generated."
            exit 1
          fi
          echo "Allure index.html found."
          # Required for GitHub Pages
          touch allure-report/.nojekyll
      # ========================================================
      # Upload generated report
      # ========================================================
      - name: Upload Allure report
        uses: actions/upload-artifact@v4
        with:
          name: allure-report
          path: allure-report/
          if-no-files-found: error
          retention-days: 30


  # ============================================================
  # Stage 3: Deploy Allure to GitHub Pages
  # ============================================================
  deploy-allure-report:
    name: Deploy Allure Report
    needs: generate-allure-report
    if: always() && needs.generate-allure-report.result == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 30

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:

      - name: Download Allure report
        uses: actions/download-artifact@v4
        with:
          name: allure-report
          path: allure-report

      - name: Verify Allure report
        run: |
          echo "========================================"
          echo "VERIFYING FINAL ALLURE REPORT"
          echo "========================================"
          ls -la allure-report
          if [ ! -f "allure-report/index.html" ]; then
            echo "ERROR: index.html does not exist."
            exit 1
          fi
          echo "Allure report is ready for deployment."
      # ========================================================
      # Upload report to GitHub Pages
      # ========================================================
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: allure-report

      # ========================================================
      # Deploy
      # ========================================================
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5

      # ========================================================
      # Display URL
      # ========================================================
      - name: Print GitHub Pages URL
        run: |
          echo "::notice::Allure Report deployed to:"
          echo "${{ steps.deployment.outputs.page_url }}"
      # ========================================================
      # Comment on Pull Request
      # ========================================================
      - name: Comment PR with Allure Report URL
        if: github.event_name == 'pull_request'
        uses: actions/github-script@v7
        with:
          script: |
            const url = `${{ steps.deployment.outputs.page_url }}`;
            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: `## Allure Test Report
            The Allure test report has been generated successfully.
            🔗 **[View Allure Report](${url})**`
            });
